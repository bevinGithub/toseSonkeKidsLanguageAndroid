<ion-header class="ion-no-border">
  <ion-toolbar class="hide-toolbar">
    <ion-title></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="home-logo">
    <img src="assets/img/inner-header.svg" alt="">
  </div>
  <div class="ion-text-center tagline">
    Forgot Password<br>
    <span class="orangeText">Please supply your email below.</span>
  </div>

  <div class="form-container ion-padding">
    <form #f='ngForm' class="forms">

      <div class="inputField">
        <ion-input class="input" fill="outline" color="dark" shape="round" [(ngModel)]="user.email" name="email"
          type="email" placeholder="Email Address"  (ionBlur)="checkEmail()" required #emailCtrl="ngModel"> </ion-input>

        <div lines="none" class="list-bg-trans" *ngIf="!validEmail && emailCtrl.touched">
          <span class="error-msg">Invalid email address!</span>
        </div>
      </div>

      <ion-button expand="block" fill="solid" shape="round" (click)="userForgotPassword()" [disabled]="!f.valid || !validEmail"
        color="primary1" class="submitBtn"> <span>Submit</span>
      </ion-button>

    </form>


    <div class="btn-container">

      <div class="terms ion-text-center">
        Already have an account? <span class="termsPink" routerLink="/signin">Sign-in here.</span>
      </div>

      <div class="line ion-text-center" style="margin-bottom: 5px;">
        <img src="assets/img/line-seperator.svg" alt="">
      </div>

    </div>


  </div>


</ion-content>
