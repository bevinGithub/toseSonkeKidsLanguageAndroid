<ion-header class="headerBg ion-no-border">

  <ion-toolbar color="warning1">

    <ion-buttons slot="start" class="menu-btn">
      <ion-menu-button color="primary"></ion-menu-button>
    </ion-buttons>

    <ion-title class="ion-text-center title-text">LANGUAGES</ion-title>
  </ion-toolbar>

</ion-header>

<ion-content>
  <div class="brownText ion-text-center">
    Choose your language
  </div>

  <ng-container *ngIf="connected">
    <ion-card *ngFor="let item of languages">
      <ion-card-content class="ion-text-left card-content" (click)="selectLanguage({ lan: item?.id });">
        <img class="icon-image" src="assets/img/{{ item?.icon }}" alt="English Language">
        <span class="language">{{ item?.language }}</span>
      </ion-card-content>
    </ion-card>
  </ng-container>

  <ng-container *ngIf="!connected">
    <div class="offlineText ion-text-center">You are currently offline.</div>
    <ion-card *ngFor="let item of offlineLanguages">
      <ion-card-content class="ion-text-left card-content" (click)="selectLanguage({ lan: item?.mysql_id });">
        <img class="icon-image" src="assets/img/{{ item?.icon }}" alt="English Language">
        <span class="language">{{ item?.language }}</span>
      </ion-card-content>
    </ion-card>
  </ng-container>

</ion-content>
<!-- FOOTER -->
<ion-footer class="ion-no-border">
  <app-footer></app-footer>
</ion-footer>
