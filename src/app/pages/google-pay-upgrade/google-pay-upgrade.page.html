<ion-header class="headerBg ion-no-border">

  <ion-toolbar color="warning1">

    <ion-buttons slot="start" class="menu-btn">
      <ion-back-button color="primary"></ion-back-button>
    </ion-buttons>

    <ion-title class="ion-text-center title-text">GOOGLE PAY</ion-title>
  </ion-toolbar>

</ion-header>

<ion-content class="ion-padding ion-text-center">
  <div class="maroontext ion-text-center">
    Subscription Selected
  </div>

  <ion-card class="ion-padding">
  <ion-card-header>
    <ion-card-title>{{ product?.title }}</ion-card-title>
    <ion-card-subtitle>{{product?.offers[0].pricingPhases[0].price}}</ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
   {{ product?.description }}
  </ion-card-content>
  <ion-button expand="block" color="primary" shape="round" (click)="changeSubscription({productID: product?.id})">SUBSCRIBE for {{product?.offers[0].pricingPhases[0].price}}</ion-button>
</ion-card>

</ion-content>
<!-- FOOTER -->
<ion-footer class="ion-no-border">
  <app-footer></app-footer>
</ion-footer>
