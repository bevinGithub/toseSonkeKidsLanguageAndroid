<ion-header class="ion-no-border">
  <ion-toolbar class="hide-toolbar">
    <ion-title></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="home-logo">
    <img src="assets/img/inner-header.svg" alt="">
  </div>
  <div class="ion-text-center ion-padding tagline">
    Forgot Password <br>Confirmation<br>
  </div>

  <div class="orangeText ion-padding ion-text-center">Your password has been reset, please check your email for the new password.</div>

  <div class="form-container ion-padding">

    <div class="btn-container">

      <ion-button class="maroonBtn" expand="block" shape="round" color="primary" routerLink="/signin">
        SIGN IN
      </ion-button>

      <div class="terms ion-text-center">
        Don't have an account? <span class="pinkText" routerLink="/signup">Sign-up here.</span>
      </div>

      <div class="line ion-text-center" style="margin-bottom: 5px;">
        <img src="assets/img/line-seperator.svg" alt="">
      </div>

    </div>


  </div>


</ion-content>
