<ion-header class="headerBg ion-no-border">

  <ion-toolbar color="warning1">

    <ion-buttons slot="start" class="menu-btn">
      <ion-back-button color="primary"></ion-back-button>
    </ion-buttons>

    <ion-title class="ion-text-center title-text">Update User Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="form-container ion-padding">
    <form #f="ngForm">

      <div class="inputField">
        <ion-label>Name</ion-label>
        <ion-input class="input" fill="outline" color="medium" shape="round" type="text" [(ngModel)]="user.name"
          name="name" placeholder="Name" autocapitalize="one" required #firstName="ngModel"> </ion-input>

        <div lines="none" class="list-bg-trans" *ngIf="!firstName.valid && firstName.touched">
          <span class="error-msg">Name Cannot be empty!</span>
        </div>
      </div>

      <div class="inputField">
        <ion-label>Surname</ion-label>
        <ion-input class="input" fill="outline" color="medium" shape="round" type="text" [(ngModel)]="user.surname"
          name="surname" placeholder="Surname" autocapitalize="one" required #surname="ngModel">
        </ion-input>

        <div lines="none" class="list-bg-trans" *ngIf="!surname.valid && surname.touched">
          <span class="error-msg">Surname Cannot be empty!</span>
        </div>
      </div>

      <div class="inputField">
        <ion-label>Email</ion-label>
        <ion-input class="input" fill="outline" color="medium" shape="round" type="email" [(ngModel)]="user.email"
          name="email" placeholder="Email Address" autocapitalize="one" required #userEmail="ngModel">
        </ion-input>

        <div lines="none" class="list-bg-trans" *ngIf="!userEmail.valid && userEmail.touched">
          <span class="error-msg">Invalid email address!</span>
        </div>
      </div>

      <div class="inputField">
        <ion-label>Mobile Number</ion-label>
        <ion-input class="input" fill="outline" color="medium" shape="round" type="tel" [(ngModel)]="user.mobile_number"
          name="mobile_number" placeholder="Contact Number" autocapitalize="one" minlength="10" maxlength="10" required
          #phoneNumber="ngModel">
        </ion-input>

        <div lines="none" class="list-bg-trans" *ngIf="!phoneNumber.valid && phoneNumber.touched">
          <span class="error-msg">Invalid mobile!</span>
        </div>
      </div>

      <div class="btn-container">
        <ion-input class="hidden-input" [(ngModel)]="user.id" name="id" placeholder="" type="text"></ion-input>
        <ion-button shape="round" expand="full" color="secondary" block (click)="updateUser()"
          [disabled]="!f.valid">Update</ion-button>
      </div>
    </form>

  </div>

</ion-content>

<ion-footer class="ion-no-border">
  <app-footer></app-footer>
</ion-footer>
