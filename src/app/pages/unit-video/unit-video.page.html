<ion-header class="headerBg ion-no-border">

  <ion-toolbar color="warning1" class="ion-text-center">

    <ion-buttons slot="start" class="menu-btn">
      <ion-back-button color="primary"></ion-back-button>
    </ion-buttons>

    <ion-title class="ion-text-center title-text" [innerHTML]="title"></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div class="iFrame" *ngIf="videoPath">
    <iframe width="100%" height="400" [src]="videoPath" frameborder="0" allowfullscreen></iframe>
  </div>

</ion-content>
<!-- FOOTER -->
<ion-footer class="ion-no-border">
  <app-footer></app-footer>
</ion-footer>
