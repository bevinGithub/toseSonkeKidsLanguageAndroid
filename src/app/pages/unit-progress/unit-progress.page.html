<ion-header class="headerBg ion-no-border">

  <ion-toolbar color="warning1" class="ion-text-center">

    <ion-buttons slot="start" class="menu-btn">
      <ion-back-button color="primary"></ion-back-button>
    </ion-buttons>

    <ion-title class="ion-text-center title-text">View Progress</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="incomplete">

  <div class="lessonContent ion-padding ion-text-center">
    <span class="subTitle">Keep track of your progress</span>
    <span class="subTitleText">{{completed}} unit(s) completed out {{incomplete}}</span>
  </div>

  <div class="percentage ion-text-center ion-no-padding">
    <span class="percentageText">{{piePercentage}}%</span>
  </div>
  <ngx-charts-pie-chart
  [view]="view"
  [scheme]="colorScheme"
  [results]="data"
  [gradient]="gradient"
  [legend]="showLegend"
  [legendPosition]="legendPosition"
  [labels]="showLabels"
  [doughnut]="isDoughnut"
  (select)="onSelect($event)"
  (activate)="onActivate($event)"
  (deactivate)="onDeactivate($event)"
  >
</ngx-charts-pie-chart>

</ion-content>
<!-- FOOTER -->
<ion-footer class="ion-no-border">
  <app-footer></app-footer>
</ion-footer>
