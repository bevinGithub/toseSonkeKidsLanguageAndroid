<ion-header class="headerBg ion-no-border">

  <ion-toolbar color="warning1">

    <ion-buttons slot="start" class="menu-btn">
      <ion-back-button color="primary"></ion-back-button>
    </ion-buttons>

    <ion-title class="ion-text-center title-text">PROFILE</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="ion-text-center tagline">
    Reset Password<br>
    <span class="orangeText">Please create a new password below.</span>
  </div>

  <div class="form-container ion-padding">
    <form #f='ngForm' class="forms">

      <div class="inputField">
        <ion-input class="input" fill="outline" color="medium" shape="round" [(ngModel)]="user.password" name="password"
          type="{{type1}}" placeholder="New Password"  required minlength="6" #passwordCtrl="ngModel">
          <ion-icon slot="end" color="dark" name="eye-outline" (click)="showPassword()"></ion-icon>
        </ion-input>

        <div lines="none" class="list-bg-trans" *ngIf="!passwordCtrl.valid && passwordCtrl.touched">
          <span class="error-msg">Invalid password, must not be less than 6 characters!</span>
        </div>
      </div>

      <div class="inputField">
        <ion-input class="input" fill="outline" color="medium" shape="round" [(ngModel)]="user.confirm_password" name="confirm_password"
          type="{{type2}}" placeholder="Confirm Password"  (ionBlur)="checkPassword()" required #passwordCtrl2="ngModel">
          <ion-icon slot="end" color="dark" name="eye-outline" (click)="showPasswordConfirm()"></ion-icon>
        </ion-input>

        <div class="list-bg-trans" *ngIf="password !== confirmPassword">
          <span class="error-msg">Password do not match!</span>
        </div>

        <div class="list-bg-trans" *ngIf="!passwordCtrl2.valid && passwordCtrl2.touched">
          <span class="error-msg">Confirm Password cannot be empty!</span>
        </div>
      </div>

      <div class="hideField">
        <ion-input class="input" fill="outline" color="medium" shape="round" [(ngModel)]="user.userID" name="userID" type="hidden" placeholder="Confirm Password"></ion-input>
      </div>

      <ion-button expand="block" fill="solid" shape="round" (click)="userResetPassword()" [disabled]="!f.valid || !validPassword"
        color="primary" class="maroonBtn"> <span>Submit</span>
      </ion-button>

    </form>


    <div class="btn-container">

      <div class="terms ion-text-center">
        Back to <span class="termsGreen" routerLink="/user-menu/user-dashboard">Dashboard</span>
      </div>

    </div>


  </div>


</ion-content>

<ion-footer class="ion-no-border">
  <app-footer></app-footer>
</ion-footer>
