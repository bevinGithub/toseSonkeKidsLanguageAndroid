<ion-header class="headerBg ion-no-border">
  <ion-toolbar color="warning1" class="ion-text-center">
    <ion-buttons slot="start" class="menu-btn">
      <ion-back-button color="primary"></ion-back-button>
    </ion-buttons>

    <ion-title
      class="ion-text-center title-text"
      [innerHTML]=" unit?.unit_title"
    ></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="watchLearn ion-text-center">
    <h5 color="medium">Watch and Learn</h5>
  </div>

  <div class="wordsList">
    <ng-container *ngIf="watchLessons">
      <ion-card>
          <div class="iFrame" *ngIf="videoPath">
          <iframe width="100%" height="320" [src]="videoPath" frameborder="0" allowfullscreen></iframe>
        </div>
      </ion-card>
    </ng-container>
  </div>
</ion-content>

<!-- FOOTER -->
<ion-footer class="ion-no-border">
  <app-footer></app-footer>
</ion-footer>
