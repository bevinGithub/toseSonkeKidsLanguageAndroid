<ion-content>
  <div class="home-bg">
    <div class="home-logo">
      <img src="assets/img/header-logo.svg" alt="">
      <div class="home-image ion-text-center">
        <swiper-container class="mySwiper" navigation="false" pagination="false" space-between="30"
          centered-slides="true" autoplay-delay="5000" autoplay-disable-on-interaction="false">
          <swiper-slide  class="slide">
            <img src="assets/img/slides/slide-1.svg" alt="Banner">
          </swiper-slide>
          <swiper-slide class="slide">
            <img src="assets/img/slides/slide-2.svg" alt="Banner">
          </swiper-slide>
          <swiper-slide class="slide-3">
            <img class="slide-3" src="assets/img/slides/slide-3.svg" alt="Banner">
          </swiper-slide>
        </swiper-container>
      </div>
    </div>
  </div>
<br>
  <div class="terms ion-text-center">
    <span class="termsGreen" style="font-weight: 600;">Parental or legal guardian consent <br>required if under 13</span>
    <br>
    By continuing you confirm that you agree to the <br><span class="termsGreen" routerLink="/terms"> Terms of
      Use</span> and <span class="termsGreen" routerLink="/policy">Privacy Policy</span>
  </div>

  <div class="ion-padding">
    <ion-button class="getStartedBtn" expand="block" shape="round" color="primary1" routerLink="/entry">
      GET STARTED
    </ion-button>

    <ion-button class="gotAccountBtn" expand="block" shape="round" color="primary1" routerLink="/signin">
      I ALREADY HAVE AN ACCOUNT
    </ion-button>
    <div class="spacer">
      &nbsp;
    </div>
  </div>




</ion-content>
